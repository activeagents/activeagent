name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # activeagent + actionagent against solid_agent, in both the combination
  # this repository develops against and the one users install today. See
  # .github/workflows/integration.yml.
  #
  # Pull requests only: on main that workflow triggers itself, so its runs
  # are attributed to it and its status badge means something.
  integration:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.3.0
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # The dashboard's JavaScript and CSS are committed under
  # actionagent/app/assets/builds so host apps never run a JavaScript build.
  # This runs the frontend's tests, rebuilds the bundle from source, and fails
  # when the committed bundle is not what the source builds.
  frontend:
    name: Dashboard frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actionagent/frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: actionagent/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # git status rather than git diff, so a file the build writes that was
      # never committed fails too.
      - name: Check the committed bundle matches its source
        run: |
          changed="$(git status --porcelain -- ../app/assets/builds)"
          if [ -n "$changed" ]; then
            echo "::error::The committed bundle does not match its source. Run npm run build in actionagent/frontend and commit actionagent/app/assets/builds."
            echo "$changed"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      CI: true
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
      OPEN_AI_API_KEY: OPEN_AI_API_KEY
      OPEN_ROUTER_API_KEY: OPEN_ROUTER_API_KEY
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
        gemfile: [
          "gemfiles/rails8.gemfile",
        ]
        include:
        - ruby: "3.4"
          gemfile: "gemfiles/railsmain.gemfile"
        - ruby: "3.4"
          gemfile: "gemfiles/ruby_llm_1.gemfile"
        - ruby: "3.3"
          gemfile: "gemfiles/rails8.gemfile"
        - ruby: "3.2"
          gemfile: "gemfiles/rails7.gemfile"
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/system-deps
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Setup database
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      working-directory: test/dummy
      run: |
        bundle exec rails db:create
        bundle exec rails db:migrate
    - name: Run tests
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      run: bin/test

  test-api-gems:
    name: Test API Gems
    runs-on: ubuntu-latest
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      CI: true
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
      OPEN_AI_API_KEY: OPEN_AI_API_KEY
      OPEN_ROUTER_API_KEY: OPEN_ROUTER_API_KEY
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
        include:
          - gemfile: "gemfiles/anthropic_1.12.gemfile"
            test-glob: "test/integration/anthropic/**/*_test.rb test/providers/usage_test.rb test/docs/providers/anthropic_examples_test.rb"
          - gemfile: "gemfiles/anthropic_1.14.gemfile"
            test-glob: "test/integration/anthropic/**/*_test.rb test/providers/usage_test.rb test/docs/providers/anthropic_examples_test.rb"
          - gemfile: "gemfiles/anthropic_latest.gemfile"
            test-glob: "test/integration/anthropic/**/*_test.rb test/providers/usage_test.rb test/docs/providers/anthropic_examples_test.rb"
          - gemfile: "gemfiles/openai_0.34.gemfile"
            test-glob: "test/integration/open_ai/**/*_test.rb"
          - gemfile: "gemfiles/openai_0.35.gemfile"
            test-glob: "test/integration/open_ai/**/*_test.rb"
          - gemfile: "gemfiles/openai_latest.gemfile"
            test-glob: "test/integration/open_ai/**/*_test.rb test/providers/usage_test.rb test/docs/providers/open_ai_examples_test.rb"
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/system-deps
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Setup database
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      working-directory: test/dummy
      run: |
        bundle exec rails db:create
        bundle exec rails db:migrate
    - name: Run tests
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      run: bundle exec ruby -Itest ${{ matrix.test-glob }}

name: Release

# Builds both gems in this repo, attaches them to a GitHub release, and
# publishes to RubyGems via trusted publishing (OIDC — no stored API key).
#
# Both gemspecs set rubygems_mfa_required, which a plain `gem push` can only
# satisfy with an OTP typed at a terminal. Trusted publishing satisfies it
# without one.
#
# Requires a trusted publisher configured on rubygems.org for BOTH gem names
# — activeagent and actionagent — each pointing at this repository and this
# workflow file (release.yml). Until that exists for a gem, its push step
# fails with an authorization error and the other gem is unaffected.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  # solid_agent depends on this framework, so a release can break it
  # downstream without either repository's own suite noticing. Publishing
  # waits on the combination being green.
  integration:
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  build:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Builds each gem from its own directory and asserts the archives
      # actually contain their entry points — a gem missing one installs and
      # resolves, then dies on require.
      - run: bundle exec rake build_all
      - uses: actions/upload-artifact@v4
        with:
          name: gems
          path: pkg/*.gem
      - name: Attach gems to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/*.gem
          generate_release_notes: true

  publish:
    # Tag pushes release; workflow_dispatch covers environments where tags
    # can't be pushed directly. RubyGems refuses to overwrite an existing
    # version, so an accidental re-run cannot double-publish.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC exchange with rubygems.org
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # The action publishes no v1 tag; @main is the ref its docs pin.
      - uses: rubygems/configure-rubygems-credentials@main
      - run: bundle exec rake build_all
      - name: Publish the framework, then the dashboard that depends on it
        # actionagent declares activeagent >= 1.2, so publishing it first
        # would leave a release nobody can bundle until the framework lands.
        #
        # A version already on RubyGems is skipped rather than fatal: the two
        # gems share this tag but version independently, so a release that
        # patches only one of them rebuilds the other at its current version.
        # Without the skip, `gem push` rejects that duplicate and takes the
        # gem that actually changed down with it.
        run: |
          publish() {
            local gem_path
            gem_path=$(ls $1)
            local name version
            name=$(basename "$gem_path" .gem | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*$//')
            version=$(basename "$gem_path" .gem | sed -E "s/^${name}-//")

            # `gem list --all` prints one line: `name (1.2.0, 1.1.0, ...)`, so the
            # version is matched between its delimiters — anchoring on "($version"
            # alone would only ever see the newest release.
            if gem list --remote --exact --all "$name" | tr -d ' ' |
                 grep -qE "[(,]${version//./\\.}[,)]"; then
              echo "$name $version is already on RubyGems; skipping."
              return 0
            fi

            gem push "$gem_path"
          }

          publish "pkg/activeagent-*.gem"
          publish "pkg/actionagent-*.gem"

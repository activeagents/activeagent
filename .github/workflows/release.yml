name: Release

# Builds both gems in this repo, attaches them to a GitHub release, and
# publishes to RubyGems via trusted publishing (OIDC — no stored API key).
#
# Both gemspecs set rubygems_mfa_required, which a plain `gem push` can only
# satisfy with an OTP typed at a terminal. Trusted publishing satisfies it
# without one.
#
# Requires a trusted publisher configured on rubygems.org for BOTH gem names
# — activeagent and actionagent — each pointing at this repository and this
# workflow file (release.yml). Until that exists for a gem, its push step
# fails with an authorization error and the other gem is unaffected.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Builds each gem from its own directory and asserts the archives
      # actually contain their entry points — a gem missing one installs and
      # resolves, then dies on require.
      - run: bundle exec rake build_all
      - uses: actions/upload-artifact@v4
        with:
          name: gems
          path: pkg/*.gem
      - name: Attach gems to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem
          generate_release_notes: true

  publish:
    # Tag pushes release; workflow_dispatch covers environments where tags
    # can't be pushed directly. RubyGems refuses to overwrite an existing
    # version, so an accidental re-run cannot double-publish.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC exchange with rubygems.org
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # The action publishes no v1 tag; @main is the ref its docs pin.
      - uses: rubygems/configure-rubygems-credentials@main
      - run: bundle exec rake build_all
      - name: Publish the framework, then the dashboard that depends on it
        # actionagent declares activeagent >= 1.2, so publishing it first
        # would leave a release nobody can bundle until the framework lands.
        #
        # Either gem may already be at the version being released: the two
        # version independently, so a patch to one leaves the other's version
        # untouched and already on RubyGems. `gem push` exits non-zero on that,
        # which under `set -e` would abort the step before the gem that DID
        # change is ever pushed. Skip what is already published instead, and
        # still fail on any other push error.
        run: |
          set -euo pipefail

          publish() {
            local path="$1" name version published
            name=$(basename "$path" | sed -E 's/-[0-9].*$//')
            version=$(basename "$path" | sed -E "s/^${name}-(.*)\.gem$/\1/")

            # `gem list --remote --exact --all NAME` prints one line:
            #   NAME (1.2.0, 1.1.0, ...)
            published=$(gem list --remote --exact --all "$name" \
              | sed -nE "s/^${name} \((.*)\)$/\1/p" | tr ',' '\n' | tr -d ' ')

            if grep -qxF "$version" <<<"$published"; then
              echo "$name $version is already on RubyGems — skipping"
              return 0
            fi

            echo "Pushing $name $version"
            gem push "$path"
          }

          publish pkg/activeagent-*.gem
          publish pkg/actionagent-*.gem
